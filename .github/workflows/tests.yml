name: "Tests"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: "Backend Tests"
    runs-on: [self-hosted, linux]
    env:
      FLASK_DEBUG: "false"
      SECRET_KEY: "unit-test-secure-key-32-bytes-long-abc12345"
      DEVELOPMENT_MODE: "false"
      DATABASE_URI: "sqlite:///:memory:"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install backend dependencies & run tests
        run: |
          python3 -m pip install --upgrade pip --break-system-packages 2>/dev/null || true
          pip install -r backend/requirements.txt --break-system-packages 2>/dev/null || true
          pytest backend/tests/ -k "not test_fastmcp_server and not test_local_graph_extract_and_build and not test_fastmcp_sse_streaming_endpoint" -v

  frontend-build:
    name: "Frontend Build"
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build
          rm -rf dist
