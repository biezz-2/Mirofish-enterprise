use_default_settings: true
general:
  debug: false
  instance_name: "MiroFish SearXNG Engine"
search:
  safe_search: 0
  autocomplete: ""
  default_lang: "id"
  formats:
    - html
    - json
server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "mirofish_searxng_ultra_secure_secret_key"
  limiter: false
  image_proxy: true
ui:
  static_use_hash: true
  default_locale: "id"
  query_in_title: true
