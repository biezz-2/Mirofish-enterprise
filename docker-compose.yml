version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: mirofish-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searchxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  neo4j:
    image: neo4j:5.26-community
    container_name: mirofish-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474" # HTTP UI
      - "127.0.0.1:7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mirofish_secret_pass}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7.2-alpine
    container_name: mirofish-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mirofish-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - SEARXNG_URL=http://searxng:8080
      - GRAPHITI_URI=bolt://neo4j:7687
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - searxng
      - neo4j
      - redis

  graphiti:
    image: python:3.12-slim
    container_name: mirofish-graphiti
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    command: python3 -m uvicorn app.services.graphiti_service:app --host 0.0.0.0 --port 8090
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      - neo4j

  mcp-server:
    image: python:3.12-slim
    container_name: mirofish-mcp-server
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    command: python3 -m mcp_server.main
    ports:
      - "127.0.0.1:8091:8091"
    depends_on:
      - backend

  frontend:
    image: node:20-alpine
    container_name: mirofish-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: npm run dev -- --port 3000 --host 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  neo4j_data:
  redis_data:
