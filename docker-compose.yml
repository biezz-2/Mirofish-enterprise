version: '3.8'

services:
  searxng:
    image: searxng/searxng:latest
    container_name: mirofish-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searchxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  neo4j:
    image: neo4j:5.26-community
    container_name: mirofish-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP UI
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/mirofish_secret_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
